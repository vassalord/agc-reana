version: 0.8.0
inputs:
  files:
    - ttbar_analysis_reana.ipynb
    - nanoaod_inputs.json
    - fix-env.sh
    - corrections.json
    - Snakefile
    - file_merging.ipynb
    - final_merging.ipynb
    - prepare_workspace.py
    - cabinetry_config.yml
    - cabinetry_fit_limit.py
    - plot_final_stack.py
    - datacard_by_hand.txt
    - make_mirrored_down.py
    - statistical_inference.py
  directories:
    - histograms
    - utils
    - results
    - combine_scripts
workflow:
  type: snakemake
  resources:
    kerberos: true
  file: Snakefile
